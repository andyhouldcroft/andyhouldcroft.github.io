    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 300; line-height: 1.6; color: #1a1a1a; background: #fff;
            transition: background-color 0.3s, color 0.3s; padding-top: 80px;
        }
        body.dark-mode { background: #0a0a0a; color: #e0e0e0; }
        body.dark-mode nav { background: rgba(10, 10, 10, 0.95); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        body.dark-mode nav .logo, body.dark-mode nav a { color: #e0e0e0; }
        body.dark-mode nav a::after { background-color: #e0e0e0; }
        body.dark-mode .coming-soon { color: #a0a0a0; }
        body.dark-mode .contact-content a { color: #e0e0e0; border-bottom: 1px solid #e0e0e0; }
        body.dark-mode footer { background: #0f0f0f; }
        body.dark-mode .footer-links a, body.dark-mode .social-links a { color: #e0e0e0; }
        .theme-toggle {
            position: fixed; bottom: 2rem; right: 2rem; width: 40px; height: 40px;
            border-radius: 50%; background: transparent; border: 1px solid rgba(26, 26, 26, 0.2);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.3s; z-index: 1000;
        }
        body.dark-mode .theme-toggle { border: 1px solid rgba(224, 224, 224, 0.2); }
        .theme-toggle:hover { background: rgba(26, 26, 26, 0.05); border-color: rgba(26, 26, 26, 0.4); }
        body.dark-mode .theme-toggle:hover { background: rgba(224, 224, 224, 0.05); border-color: rgba(224, 224, 224, 0.4); }
        .theme-toggle svg { width: 20px; height: 20px; color: #1a1a1a; }
        body.dark-mode .theme-toggle svg { color: #e0e0e0; }
        nav {
            position: fixed; top: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px); padding: 1.5rem 4rem; z-index: 1000;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        nav .nav-content { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; }
        nav .logo { font-size: 1.1rem; font-weight: 300; text-decoration: none; color: #1a1a1a; }
        nav ul { list-style: none; display: flex; gap: 2.5rem; }
        nav a { text-decoration: none; color: #1a1a1a; font-size: 1.1rem; font-weight: 300; position: relative; }
        nav a::after {
            content: ''; position: absolute; width: 0; height: 1px; bottom: -2px; left: 50%;
            background-color: #1a1a1a; transition: width 0.3s ease, left 0.3s ease;
        }
        nav a:hover::after { width: 100%; left: 0; }
        .section { padding: 6rem 4rem; max-width: 1400px; margin: 0 auto; }
        .section-title { font-size: 2.5rem; font-weight: 300; margin-bottom: 1rem; }
        .coming-soon {
            font-size: 1.5rem; color: #666; text-align: center; padding: 6rem 0;
            min-height: 50vh; display: flex; align-items: center; justify-content: center;
        }
        .contact-content { max-width: 600px; font-size: 1.1rem; line-height: 1.6; }
        .contact-content p { margin-bottom: 1.5rem; }
        .contact-content a { color: #1a1a1a; text-decoration: none; border-bottom: 1px solid #1a1a1a; }
        .contact-content a:hover { opacity: 0.6; }
        .social-icon { width: 24px; height: 24px; transition: opacity 0.3s; }
        .contact-content a:has(.social-icon) { border-bottom: none; }
        .contact-content a:has(.social-icon):hover { opacity: 0.6; }
        footer { background: #f5f5f5; padding: 3rem 4rem; }
        .footer-content {
            max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between;
            align-items: center; font-size: 0.9rem;
        }
        .footer-links { display: flex; gap: 2rem; }
        .footer-links a { color: #1a1a1a; text-decoration: none; font-size: 0.9rem; }
        .footer-links a:hover { opacity: 0.6; }
        .social-links { display: flex; gap: 1.5rem; }
        .social-links a { color: #1a1a1a; text-decoration: none; }
        .social-links a:hover { opacity: 0.6; }
        @media (max-width: 768px) {
            nav { padding: 1rem 2rem; }
            nav ul { gap: 1.5rem; }
            .section { padding: 4rem 2rem; }
            .footer-content { flex-direction: column; gap: 2rem; text-align: center; }
        }
    </style>
</head>

    <script>
        const getPreferredTheme = () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) return savedTheme;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        };
        const setTheme = (theme) => {
            if (theme === 'dark') { document.body.classList.add('dark-mode'); }
            else { document.body.classList.remove('dark-mode'); }
            localStorage.setItem('theme', theme);
        };
        setTheme(getPreferredTheme());
        document.getElementById('themeToggle').addEventListener('click', () => {
            const currentTheme = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!localStorage.getItem('theme')) setTheme(e.matches ? 'dark' : 'light');
        });
    </script>
